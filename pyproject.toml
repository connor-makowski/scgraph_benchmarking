[tool.black]
line-length = 80
target-version = ['py39']
exclude = '/.*(__pycache__).*/'

[tool.setuptools]
packages = ["benchmarks"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scgraph_benchmarking"
version = "3.4.0"
description = "Benchmarks for the SCGraph Python Package"
authors = [
    {name="Connor Makowski", email="conmak@mit.edu"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    'License :: OSI Approved :: MIT License',
    "Operating System :: OS Independent",
]
dependencies = [
    "igraph==1.0.0",
    "networkx==3.6.1",
    "osmnx==2.1.0",
    "pamda==2.7.2",
    "requests==2.32.4",
    "type_enforced==2.3.0",
    "scgraph==3.4.0",
    "polyline",
    "matplotlib",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "autoflake>=2.3.1",
    "black>=25.1.0",
]

[project.urls]
"Homepage" = "https://github.com/connor-makowski/scgraph_benchmarking"
"Bug Tracker" = "https://github.com/connor-makowski/scgraph_benchmarking/issues"
"Documentation" = "https://connor-makowski.github.io/scgraph_benchmarking/README.md"
